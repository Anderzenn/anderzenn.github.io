<!DOCTYPE html>
<html>
	<head>
		<!-- Global site tag (gtag.js) - Google Analytics -->

		<script>
 			window.dataLayer = window.dataLayer || [];
  			function gtag(){dataLayer.push(arguments);}
  			gtag('js', new Date());

  			gtag('config', 'UA-62658118-3');
        </script>
        <!-- Google Analytics End -->

		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<meta name="HandheldFriendly" content="true">
		<title>Mads Andersen</title>
		<link href="assets/img/ANDZ.ico" rel="shortcut icon" type="image/x-icon">
		<link rel="stylesheet" type="text/css" href="assets/css/main.css">
		<link rel="stylesheet" type="text/css" href="assets/css/ionicons.min.css">
	</head>
	<body>
		<!-- Images used to open the lightbox -->
<div class="row">
		<div class="column">
		  <img src="assets/img/bmw1.jpg" onclick="openModal();currentSlide(1)" class="hover-shadow">
		</div>
		<div class="column">
		  <img src="assets/img/bmw2.jpg" onclick="openModal();currentSlide(2)" class="hover-shadow">
		</div>
		<div class="column">
		  <img src="assets/img/bmw3.jpg" onclick="openModal();currentSlide(3)" class="hover-shadow">
		</div>
		<div class="column">
		  <img src="assets/img/bmw4.jpg" onclick="openModal();currentSlide(4)" class="hover-shadow">
		</div>
	  </div>
	  
	  <!-- The Modal/Lightbox -->
	  <div id="myModal" class="modal">
		<span class="close cursor" onclick="closeModal()">&times;</span>
		<div class="modal-content">
	  
		  <div class="mySlides">
			<div class="numbertext">1 / 4</div>
			<img src="assets/img/bmw1.jpg" style="width:100%">
		  </div>
	  
		  <div class="mySlides">
			<div class="numbertext">2 / 4</div>
			<img src="assets/img/bmw2.jpg" style="width:100%">
		  </div>
	  
		  <div class="mySlides">
			<div class="numbertext">3 / 4</div>
			<img src="assets/img/bmw3.jpg" style="width:100%">
		  </div>
	  
		  <div class="mySlides">
			<div class="numbertext">4 / 4</div>
			<img src="assets/img/bmw4.jpg" style="width:100%">
		  </div>
	  
		  <!-- Next/previous controls -->
		  <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
		  <a class="next" onclick="plusSlides(1)">&#10095;</a>
	  
		  <!-- Caption text -->
		  <div class="caption-container">
			<p id="caption"></p>
		  </div>
	  
		  <!-- Thumbnail image controls -->
		  <div class="column">
			<img class="demo" src="assets/img/bmw1.jpg" onclick="currentSlide(1)" alt="BMW 520i E34. Shot on OnePlus 5T">
		  </div>
	  
		  <div class="column">
			<img class="demo" src="assets/img/bmw2.jpg" onclick="currentSlide(2)" alt="BMW 520i E34. Shot on OnePlus 5T">
		  </div>
	  
		  <div class="column">
			<img class="demo" src="assets/img/bmw3.jpg" onclick="currentSlide(3)" alt="BMW 520i E34. Shot on OnePlus 5T">
		  </div>
	  
		  <div class="column">
			<img class="demo" src="assets/img/bmw4.jpg" onclick="currentSlide(4)" alt="BMW 520i E34. Shot on OnePlus 5T">
		  </div>
		</div>
	  </div>

	  <script>
			// Open the Modal
			function openModal() {
			  document.getElementById('myModal').style.display = "block";
			}
			
			// Close the Modal
			function closeModal() {
			  document.getElementById('myModal').style.display = "none";
			}
			
			var slideIndex = 1;
			showSlides(slideIndex);
			
			// Next/previous controls
			function plusSlides(n) {
			  showSlides(slideIndex += n);
			}
			
			// Thumbnail image controls
			function currentSlide(n) {
			  showSlides(slideIndex = n);
			}
			
			function showSlides(n) {
			  var i;
			  var slides = document.getElementsByClassName("mySlides");
			  var dots = document.getElementsByClassName("demo");
			  var captionText = document.getElementById("caption");
			  if (n > slides.length) {slideIndex = 1}
			  if (n < 1) {slideIndex = slides.length}
			  for (i = 0; i < slides.length; i++) {
				slides[i].style.display = "none";
			  }
			  for (i = 0; i < dots.length; i++) {
				dots[i].className = dots[i].className.replace(" active", "");
			  }
			  slides[slideIndex-1].style.display = "block";
			  dots[slideIndex-1].className += " active";
			  captionText.innerHTML = dots[slideIndex-1].alt;
			}
			</script>
	</body>
</html>
