# Site settings
title: Andersenn
name: Anderzenn - Blog
owner: Mads Andersen
email: thedanishmotovlogger@gmail.com
twitter_username: dkmotovlogger
github_username: Anderzenn
description: >
  This is the website for Mads Andersen.
  This is where he will be the easiest to contact and where he posts updates on his blog.
url: "http://anderzenn.github.io"
timezone: Europe/Copenhagen


# Build settings
markdown: kramdown
permalink: /blog/:year/:month/:day/:title
paginate: 7
assets:
  digest: true

defaults:
  -
    scope:
      path: "" # an empty string here means all files in the project
    values:
      layout: "default"
      
# Conversion
markdown:    kramdown
highlighter: rouge
lsi:         false
excerpt_separator: "\n\n"
incremental: false