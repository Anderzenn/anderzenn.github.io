---
layout: default
comments: true
---

<div class="notes">
		<div class="note single">
            <img class="blogImage" src="{{ page.image | prepend: relative_url }}" >
            <h1 class="title">{{ page.title }} {{ page.postName }}</h1>
			
			<h2 class="date"><info datetime="{{ page.date }}">
				{{ page.date | date: "%b %d, %Y" }} {% if page.author %} by {{ page.author }} {% endif %}
			</info></h2>
			<!-- Post content -->
			<div class="notebody">
				{{ content }}
			</div>
			<!-- Post info -->
			<div class="noteinfo">
            <!-- include some categories and tags maybe? -->
                <span>{% if page.category %}Categories: {{ page.category }} {% endif %}</span>
			</div>

			<hr>

			<!-- Post comments -->
			<div class="notecomments">
				{% include disqus.html %}	 
			</div>
		</div><!-- / .note .single -->
</div><!-- /.notes -->
