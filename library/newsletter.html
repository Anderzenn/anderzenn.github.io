<!DOCTYPE HTML>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="description" content="HTML Library for 'basic' things on websites.">
		<meta name="keywords" content="HTML,CSS,JavaScript,Design,Programming,Library">
		<meta name="author" content="Mads Rosengren Andersen">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>HTML Library</title>
        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/newsletter.css">
        <link rel="stylesheet" href="prism/prism.css">
	</head>
	<body>
        <section class="container">
            <nav>
                <ul>
                    <li><a href="index.html">Contact Form</a></li>
                    <li><a href="meta.html">Meta Tags</a></li>
                    <li><a href="newsletter.html">Newsletter</a></li>
                </ul>
            </nav>
            <h2 id="title">Newsletter Box</h2>
            <form name="formValidation" action="#" onsubmit="return false">
                <label>Sign up for our newsletter!</label>
                <input class="left"  type="email" name="email" id="email" placeholder="Enter your email..">
                <input class="left"  type="submit" name="submit" value="Send" onclick="ValidateEmail(document.formValidation.email)">
                <div class="clearfix"></div>
                <span id="notification" class=""></span>
            </form>
            
            <figure>
                <figcaption>Newsletter - HTML</figcaption>
                <pre class="language-html">
                <code>
                    <xmp>
                        <form name="formValidation" action="#" onsubmit="return false">
                            <label>Sign up for our newsletter!</label>
                            <input class="left"  type="email" name="email" id="email" placeholder="Enter your email..">
                            <input class="left"  type="submit" name="submit" value="Send" onclick="ValidateEmail(document.formValidation.email)">
                            <div class="clearfix"></div>
                            <span id="notification" class=""></span>
                        </form>
                    </xmp>
                </code>
                </pre>
            </figure>
            
            <figure>
                <figcaption>Newsletter - CSS</figcaption>
                <pre class="language-css">
                <code>
                    #notification {
    display: none;
    width: 100%;
    padding: 10px;
    border-radius: 5px;
    color: #fff;
    margin: 0 auto;
    margin-top: 20px;
}

#notification.successful {
    display: block!important;
    background: #2BBD30;
}

#notification.unSuccessful {
    display: block!important;
    background: #E31B1B;
}

form[name="formValidation"] {
    background: #F7F7F7;
    width: 500px;
    display: inline-block;
    padding: 10px;
    box-shadow: 0px 0px 5px 0px #C2C2C2;
    border-radius: 5px;
}

form[name="formValidation"] label {
    display: block;
    margin-bottom: 30px;
    margin-top: 10px;
    font-size: 32px;
}

form[name="formValidation"] input[type="email"] {
    display: block;
    border: solid 1px #C2C2C2;
    height: 40px;
    width: 80%;
    text-indent: 10px;
    border-top-left-radius: 5px;
    border-bottom-left-radius: 5px;
}

form[name="formValidation"] input[type="submit"] {
    display: block;
    background: #2BBD30;
    height: 40px;
    width: 20%;
    font-size: 16px;
    color: #fff;
    border: none;
    border-top-right-radius: 5px;
    border-bottom-right-radius: 5px;
}

                </code>
                </pre>
            </figure>
            
            <figure>
                <figcaption>Newsletter - JavaScript</figcaption>
                <pre class="language-js">
                <code>
                    function ValidateEmail(inputText) {
                var email = document.getElementById("email").placeholder;
                var notificationSpan = document.getElementById("notification");
                var mailFormat = /^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$/;
                
                if (inputText.value.match(mailFormat)) {
                    document.formValidation.email.focus();
                    notificationSpan.textContent = "You've been added to our newsletter!";
                    notificationSpan.classList.add("successful");
                    notificationSpan.classList.remove("unSuccessful");
                } else {
                    document.formValidation.email.focus();
                    notificationSpan.textContent = "The email you entered is invalid!";
                    notificationSpan.classList.add("unSuccessful");
                    notificationSpan.classList.remove("successful");
                }
            }
                </code>
                </pre>
            </figure>
            
            
        </section>
        <script src="prism/prism.js"></script>
        
        
        
        <script>
            function ValidateEmail(inputText) {
                var email = document.getElementById("email").placeholder;
                var notificationSpan = document.getElementById("notification");
                var mailFormat = /^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$/;
                
                if (inputText.value.match(mailFormat)) {
                    document.formValidation.email.focus();
                    notificationSpan.textContent = "You've been added to our newsletter!";
                    notificationSpan.classList.add("successful");
                    notificationSpan.classList.remove("unSuccessful");
                } else {
                    document.formValidation.email.focus();
                    notificationSpan.textContent = "The email you entered is invalid!";
                    notificationSpan.classList.add("unSuccessful");
                    notificationSpan.classList.remove("successful");
                }
            }
        </script>
        
        
	</body>
</html>
