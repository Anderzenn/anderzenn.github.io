---
layout: default
title: Anderzenn &bull; Blog
---
	<div class="posts">

      {% for post in site.posts %}
        <a href="{{ post.url }}" title="{{ post.postName }}">
            <img alt="{{ post.postName }}" src="{{ post.image | prepend: relative_url }}" >
            <span>{{ post.postName }} &mdash; {{ post.date | date_to_string }}</span>

        </a>
	  {% endfor %}
    </div>
